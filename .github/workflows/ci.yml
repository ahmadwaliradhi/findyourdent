name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Nothing here reaches production, so it neither needs CI nor a deploy.
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    name: Web and contracts (Biome, Vitest against Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The Firebase emulators need a JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Contracts are generated and current
        run: pnpm contracts:check

      - name: Contracts typecheck
        run: pnpm --filter @findyourdent/contracts typecheck

      - name: Contracts tests
        run: pnpm --filter @findyourdent/contracts test

      - name: Web API tests (Vitest under firebase emulators:exec)
        run: pnpm --filter web test

  agent:
    name: Agent service (Ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only; there is no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --directory services/agent --locked

      - name: Ruff lint
        run: uv run --directory services/agent ruff check .

      - name: Ruff format
        run: uv run --directory services/agent ruff format --check .

      - name: Pydantic models are generated and current
        run: uv run --directory services/agent python scripts/generate_contracts.py --check

      - name: pytest
        run: uv run --directory services/agent pytest

  infra:
    name: Infra scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

  # Production deploy (ADR-0012). Only after every job above is green, only for a push
  # to main, and only once someone approves the `production` environment. Authenticates
  # with Workload Identity Federation (no keys) as fyd-deployer, which can build and
  # deploy but not change IAM or Cloud Scheduler: PROVISION=0 skips those steps of
  # infra/gcp/deploy.sh. Set up once with infra/gcp/setup-cicd.sh.
  deploy:
    name: Deploy to production (Cloud Run, Firebase)
    needs: [web, agent, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://findyourdent.com
    permissions:
      contents: read
      id-token: write
    # A newer push waits for a running deploy instead of cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT_ID: findyourdent
      PROVISION: "0"
      # smoke.sh mints the agent identity token as the deploy service account.
      SMOKE_IMPERSONATE_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # deploy.sh runs the Firebase CLI from apps/web.
      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # The agent first: the web service reads its URL.
      - name: Deploy agent
        run: infra/gcp/deploy.sh agent

      - name: Deploy web, rules, indexes, Hosting and smoke test
        run: infra/gcp/deploy.sh web
