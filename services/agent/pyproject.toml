[project]
name = "findyourdent-agent"
version = "0.1.0"
description = "FindYourDent agent service: Guidance, Shortlist reasons, Moderation and Price List extraction behind one HTTP contract."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "google-adk==2.12.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
agent-dev = "findyourdent_agent.cli:dev"
agent-serve = "findyourdent_agent.cli:serve"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]==0.85.0",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# evals/ holds the evaluation runners (spec 06); tests import their scoring.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "evals"]
# Generated from packages/contracts/schemas; kept stable by scripts/generate_contracts.py.
extend-exclude = ["src/findyourdent_agent/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]
"evals/**" = ["S603", "S607"]
